<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" type="text/css" href="webstyle.css"/>
        <title>My Animated SVG</title>
    </head>
    <body>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
            <desc>A fire flower from Nintendo's Mario Bros.</desc>
            <g>
                <!--Leaves group left-->
                <g transform="rotate(25 70 170)">
                    <ellipse cx="70" cy="170" rx="35" ry="20" fill="#8BC751" stroke="#000000" stroke-width="4"/>
                    <line x1="100" y1="170" x2="60" y2="170" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
                    <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                        values="15 70 170; 35 70 170; 15 70 170" dur="3s" repeatCount="indefinite"/>
                </g>
                
                <!--Leaves group right-->
                <g transform="rotate(-25 130 170)">
                    <ellipse cx="130" cy="170" rx="35" ry="20" fill="#8BC751" stroke="#000000" stroke-width="4"/>
                    <line x1="100" y1="170" x2="140" y2="170" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
                    <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                        values="-15 130 170; -35 130 170; -15 130 170" dur="3s" repeatCount="indefinite"/>
                </g>
                
                <!--Stem-->
                <rect x="92.5" y="115" width="15" height="85" fill="#76C043" stroke="#000000" stroke-width="4"/>
                
                <!--Orange oval (moves up with stem)-->
                <ellipse cx="100" cy="100" rx="60" ry="45" fill="#F15A22" stroke="#000000" stroke-width="5">
                    <animate attributeName="rx" values="60;65;60" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="ry" values="45;50;45" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="100;90;100" dur="2s" repeatCount="indefinite"/>
                </ellipse>
                
                <!--Yellow oval (moves up with stem)-->
                <ellipse cx="100" cy="100" rx="45" ry="32" fill="#FFF200" stroke="#000000" stroke-width="3">
                    <animate attributeName="rx" values="45;50;45" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="ry" values="32;37;32" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="100;90;100" dur="2s" repeatCount="indefinite"/>
                </ellipse>
                
                <!--White oval (moves up with stem)-->
                <ellipse cx="100" cy="100" rx="30" ry="21" fill="#FFFFFF" stroke="#000000" stroke-width="2">
                    <animate attributeName="rx" values="30;35;30" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="ry" values="21;26;21" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="100;90;100" dur="2s" repeatCount="indefinite"/>
                </ellipse>
                
                <!--Eyes (move up with stem)-->
                <rect x="82" y="88" width="6" height="20" rx="7" ry="7" fill="#000000" stroke="#000000" stroke-width="2">
                    <animate attributeName="height" values="20;20;2;20" keyTimes="0;0.95;0.975;1" dur="4s" repeatCount="indefinite"/>
                    <animate attributeName="y" values="88;78;88" dur="2s" repeatCount="indefinite"/>
                </rect>
                <rect x="112" y="88" width="6" height="20" rx="7" ry="7" fill="#000000" stroke="#000000" stroke-width="2">
                    <animate attributeName="height" values="20;20;2;20" keyTimes="0;0.95;0.975;1" dur="4s" repeatCount="indefinite"/>
                    <animate attributeName="y" values="88;78;88" dur="2s" repeatCount="indefinite"/>
                </rect>
                
                <!--Eye highlights (move up with stem)-->
                <rect x="83" y="89" width="4" height="7" rx="3" ry="3" fill="#FFFFFF">
                    <animate attributeName="y" values="89;79;89" dur="2s" repeatCount="indefinite"/>
                </rect>
                <rect x="113" y="89" width="4" height="7" rx="3" ry="3" fill="#FFFFFF">
                    <animate attributeName="y" values="89;79;89" dur="2s" repeatCount="indefinite"/>
                </rect>
            </g>
        </svg>
    </body>
</html>
